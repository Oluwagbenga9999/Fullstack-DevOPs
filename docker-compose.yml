services:
  backend:
    build: .
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      API_PORT: 3001
    command: node server.js
    restart: unless-stopped
  frontend:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      FRONTEND_PORT: 3000
      BACKEND_URL: http://backend:3001
    command: node frontend-server.js
    restart: unless-stopped
